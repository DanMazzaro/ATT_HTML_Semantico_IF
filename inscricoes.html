<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Inscrição</title>
</head>
<body>

<h2>Inscrição em Curso Técnico</h2>

<form>
  Nome completo:<br>
  <input type="text" required><br><br>

  CPF:<br>
  <input type="text" required><br><br>

  Data de nascimento:<br>
  <input type="date"><br><br>

  Endereço:<br>
  Rua: <input type="text"><br>
  Número: <input type="number"><br>
  Cidade: <input type="text"><br>
  Estado: <input type="text"><br><br>

  Curso desejado:<br>
  <select>
    <option>Informática</option>
    <option>Administração</option>
    <option>Enfermagem</option>
    <option>Mecânica</option>
  </select><br><br>

  Turno:<br>
  <input type="radio" name="turno"> Manhã
  <input type="radio" name="turno"> Tarde
  <input type="radio" name="turno"> Noite<br><br>

  Experiência:<br>
  <input type="radio" name="exp"> Sim
  <input type="radio" name="exp"> Não<br><br>

  Áreas de interesse:<br>
  <input type="checkbox"> Tecnologia
  <input type="checkbox"> Saúde
  <input type="checkbox"> Negócios<br><br>

  Upload de documento:<br>
  <input type="file"><br><br>

  Observações:<br>
  <textarea></textarea><br><br>

  <button type="submit">Enviar</button>
</form>

</body>
</html>
